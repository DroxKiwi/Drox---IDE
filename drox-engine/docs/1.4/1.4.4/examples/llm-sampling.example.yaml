# Exemple — profils de sampling Drox 1.4.4 (dev / dogfood)
# Copier vers <workspace>/.drox/llm-sampling.yaml et ajuster.
#
# Référence : ../PLAN-1.4.4.md

version: 1

defaults:
  sampling:
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.05
    min_p: 0.05

profiles:
  discuss:
    match:
      architect_interaction: discussion
    sampling:
      top_p: 0.9
      repeat_penalty: 1.05

  plan:
    match:
      rail_station: plan
    extends: discuss
    sampling:
      temperature: 0.4
      top_p: 0.85

  file_mutation:
    match:
      phase: acting
      tool_any: [file_edit, file_write, notebook_edit]
    sampling:
      temperature: 0.15
      top_p: 0.8
      repeat_penalty: 1.0

  answering:
    match:
      phase: answering
    sampling:
      temperature: 0.5
      top_p: 0.9
      repeat_penalty: 1.02
