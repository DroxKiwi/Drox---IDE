# Context Frame manifest v0 — parité comportementale 1.4.1.3
# Source de vérité spec ; le moteur embarque l'équivalent dans orchestration/context_frame/manifest.rs

version: 0
schema: context-frame/0.1

frames:
  - id: architect.boot
    role: architect
    station: null
    trigger: boot
    layers:
      - block_id: G3EditCore
        mode: boot_append
        source: static_md
        path: orchestration/prompts/system/blocks/edit/01_core_rail_solo.md
      - block_id: NativeThinkingSupplement
        mode: boot_append
        source: static_fn
        when: chat_options.think == true

  - id: architect.*.iteration_start
    role: architect
    station: "*"
    trigger: iteration_start
    layers:
      - layer_id: ctx_run_snapshot
        block_id: CtxRunSnapshot
        mode: replace_marked
        marker: "## Architect run snapshot (engine)"
        skip_if_unchanged: true
        source: dynamic_fn
        fn: architect_run_context_block_per_turn

      - layer_id: tool_protocols
        block_id: ToolProtocols
        mode: replace_marked
        marker: "## Architect tool protocols (engine)"
        skip_if_unchanged: true
        source: dynamic_fn
        fn: tool_supplements_for_station
        fallback_fn: tool_supplements_all_architect
        when_no_rail: use fallback_fn

      - layer_id: rail_turn_hooks
        mode: state_only
        source: dynamic_fn
        fn: rail.on_turn_start
        when: run_rail_active

      - layer_id: rail_snapshot
        block_id: RailSnapshot
        mode: replace_marked
        marker: "## Run rail (engine)"
        skip_if_unchanged: true
        source: dynamic_fn
        fn: rail.refresh_snapshot
        when: run_rail_active

  - id: architect.*.post_checkpoint
    role: architect
    station: "*"
    trigger: post_compaction
    layers:
      - layer_id: ctx_run_snapshot
        block_id: CtxRunSnapshot
        mode: insert_after_checkpoint
        marker: "## Architect run snapshot (engine)"
        source: dynamic_fn
        fn: architect_run_context_block_compaction

  - id: architect.*.gate_nudge
    role: architect
    station: "*"
    trigger: gate_nudge
    mode: append
    nudge_ids:
      - done.missing_mutation
      - done.missing_answering
      - done.unfinished_todos
      - done.verify_not_passed
      - done.only_marker
      - rail.post_todos_answering
      - rail.act_stall
      - schema_error.continue
      - rail.act_mutation_success
      - rail.act_tool_failure_continue
      - rail.act_tool_failure_stop
      - ask_user_question.loop

# Stations → protocoles (layer tool_protocols)
station_tool_protocols:
  intent: [workspace_map_read, file_read, grep, lsp]
  read: [workspace_map_read, file_read, grep, lsp]
  propose: [todo_write, architect_help, ask_user_question, workspace_map_read, file_read, grep]
  plan: [todo_write, architect_help, ask_user_question, workspace_map_read, file_read, grep]
  act: [file_edit, file_write, todo_write, file_read]
  verify: [lsp, grep, file_read]
  answer: [todo_write]

# Futur Phase 3 — non actif en v0
tool_folders:
  edit_file:
    expands_to: [file_edit, file_write]
    visible_at: [act]
  read_workspace:
    expands_to: [file_read, grep, workspace_map_read]
    visible_at: [read, intent]
  verify_project:
    expands_to: [lsp, grep, file_read, bash]
    visible_at: [verify]

# Futur Phase 4 — non actif en v0
internal_plan:
  tool: internal_plan_write
  marker: "## Internal work plan (engine only)"
  visible_ui: false
  stations: [plan, act, verify]
