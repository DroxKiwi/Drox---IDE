[package]
name = "drox-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Drox — local text embeddings (llama.cpp GGUF, CB2)"

[lints]
workspace = true

[features]
default = []
# Links llama.cpp and enables real GGUF encode.
embed = ["dep:llama-cpp-2"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
llama-cpp-2 = { version = "0.1.157", optional = true, default-features = false, features = ["common"] }
